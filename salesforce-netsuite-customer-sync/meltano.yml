send_anonymous_usage_stats: false
plugins:
  extractors:
  - name: tap-salesforce
    variant: meltanolabs
    pip_url: -e ./extract/tap-salesforce
    config:
      api_type: REST
      start_date: '2010-01-01T00:00:00Z'
      # Discovery describes only these objects. Without this list the tap
      # describes every object in the org on every run, and each describe
      # counts against the daily REST quota. Keep this list in sync with `select`.
      streams_to_discover:
      - Account
      - Contact
    settings:
    - name: refresh_token_store_hook
      kind: string
    - name: streams_to_discover
      kind: array
    metadata:
      '*':
        replication-method: FULL_TABLE
    select:
    - Account.*
    - Contact.*
  - name: tap-netsuite
    namespace: tap_netsuite
    pip_url: -e ./extract/tap-netsuite
    capabilities:
    - state
    - catalog
    - discover
    settings:
    - name: production
      kind: boolean
    - name: account_id
    - name: client_id
      sensitive: true
    - name: certificate_id
    - name: private_key
      sensitive: true
    select:
    - customer.*
    - contact.*
  - name: tap-duckdb
    namespace: tap_duckdb
    # fs requires pkg_resources, which setuptools 81 removed.
    pip_url: git+https://github.com/MeltanoLabs/tap-duckdb.git@ba2a6cca5a1c5d3961a8a9975056920f2135078e duckdb==1.5.5 setuptools==80.9.0
    capabilities:
    - state
    - catalog
    - discover
    settings:
    - name: path
    config:
      path: $DUCKDB_PATH
    metadata:
      '*':
        replication-method: FULL_TABLE
    select:
    - '*\.autoidm-netsuite_customer_target_create.*'
    - '*\.autoidm-netsuite_customer_target_update.*'
    - '*\.autoidm-netsuite_contact_target_create.*'
    - '*\.autoidm-netsuite_contact_target_update.*'
  - name: tap-duckdb-logs
    inherit_from: tap-duckdb
    select:
    - '*\.autoidm-*.*'
  loaders:
  - name: target-duckdb
    variant: jwills
    pip_url: git+https://github.com/MeltanoLabs/target-duckdb.git@4dc49b9bac09966cf31ae8d06c99ffe5d0a0384a duckdb==1.5.5
    config:
      filepath: $DUCKDB_PATH
      default_target_schema: $MELTANO_EXTRACT__LOAD_SCHEMA
      add_metadata_columns: true
      batch_size_rows: 100
  - name: target-netsuite
    namespace: target_netsuite
    pip_url: -e ./load/target-netsuite
    settings:
    - name: production
      kind: boolean
    - name: account_id
    - name: client_id
      sensitive: true
    - name: certificate_id
    - name: private_key
      sensitive: true
  - name: target-csv
    namespace: target_csv
    pip_url: git+https://github.com/MeltanoLabs/target-csv.git@7de9ef4231bb582c78b94449b38a256295b746bb
    executable: target-csv
    config:
      output_path_prefix: $ARTIFACTS_PATH
      timestamp_format: '%Y-%m-%d.T%H%M%S'
      file_naming_scheme: '{timestamp}_{stream_name}.csv'
  transformers:
  - name: dbt
    namespace: dbt_duckdb
    pip_url: dbt-core==1.10.1 dbt-duckdb==1.11.0 duckdb==1.5.5
    commands:
      pre_python: run -m +stg_salesforce_account +stg_salesforce_contact +stg_netsuite_customer +stg_netsuite_contact
      post_python: run -m +netsuite_customer_target_create +netsuite_customer_target_update +netsuite_contact_target_create +netsuite_contact_target_update
      drop_source_salesforce: run-operation autoidm_drop_salesforce
      drop_source_netsuite: run-operation autoidm_drop_netsuite
    config:
      target: duckdb
      path: $DUCKDB_PATH
      project_dir: $MELTANO_PROJECT_ROOT/transform
      PROFILES_DIR: $MELTANO_PROJECT_ROOT/transform/profile
      source_schema: $MELTANO_LOAD__TARGET_SCHEMA
      target_schema: autoidm
  utilities:
  - name: autoidm-transform
    namespace: autoidm_transform
    pip_url: -e ./autoidm-transform
environments:
- name: dev
  config:
    plugins:
      extractors:
      - name: tap-salesforce
        config:
          is_sandbox: false
      - name: tap-netsuite
        config:
          production: false
      loaders:
      - name: target-netsuite
        config:
          production: false
  env:
    SQLALCHEMY_URL: duckdb:///$DUCKDB_PATH
- name: prod
  config:
    plugins:
      extractors:
      - name: tap-salesforce
        config:
          is_sandbox: false
      - name: tap-netsuite
        config:
          production: false
      loaders:
      - name: target-netsuite
        config:
          production: false
  env:
    SQLALCHEMY_URL: duckdb:///$DUCKDB_PATH
jobs:
- name: extract
  tasks:
  - dbt:drop_source_salesforce dbt:drop_source_netsuite tap-salesforce target-duckdb tap-netsuite target-duckdb
- name: transform
  tasks:
  - dbt:pre_python autoidm-transform dbt:post_python
- name: artifacts
  tasks:
  - tap-duckdb-logs target-csv
- name: load
  tasks:
  - tap-duckdb target-netsuite
venv:
  backend: uv
project_id: 01a05801-83bd-7106-9262-2a05cd5e38e4
