{
  "plugin_type": "loaders",
  "name": "target-salesforce",
  "namespace": "target_salesforce",
  "variant": "dan-ladd",
  "label": "Salesforce",
  "docs": "https://hub.meltano.com/loaders/target-salesforce--dan-ladd",
  "repo": "https://github.com/dan-ladd/target-salesforce",
  "pip_url": "git+https://github.com/dan-ladd/target-salesforce.git",
  "description": "CRM",
  "logo_url": "https://hub.meltano.com/assets/logos/loaders/salesforce.png",
  "capabilities": [
    "about",
    "schema-flattening",
    "stream-maps"
  ],
  "settings_group_validation": [
    []
  ],
  "settings": [
    {
      "name": "action",
      "kind": "options",
      "value": "update",
      "label": "Action",
      "description": "How to handle incomming records by default (insert/update/upsert/delete/hard_delete)",
      "options": [
        {
          "label": "Insert",
          "value": "insert"
        },
        {
          "label": "Update",
          "value": "update"
        },
        {
          "label": "Delete",
          "value": "delete"
        },
        {
          "label": "Hard Delete",
          "value": "hard_delete"
        },
        {
          "label": "Upsert",
          "value": "upsert"
        }
      ]
    },
    {
      "name": "allow_failures",
      "kind": "boolean",
      "value": false,
      "label": "Allow Failures",
      "description": "Allows the target to continue persisting if a record fails to commit"
    },
    {
      "name": "client_id",
      "kind": "string",
      "label": "Client ID",
      "description": "OAuth client_id",
      "sensitive": true
    },
    {
      "name": "client_secret",
      "kind": "string",
      "label": "Client Secret",
      "description": "OAuth client_secret",
      "sensitive": true
    },
    {
      "name": "domain",
      "kind": "string",
      "value": "login",
      "label": "Domain",
      "description": "Your Salesforce instance domain. Use 'login' (default) or 'test' (sandbox), or Salesforce My domain."
    },
    {
      "name": "flattening_enabled",
      "kind": "boolean",
      "label": "Flattening Enabled",
      "description": "'True' to enable schema flattening and automatically expand nested properties."
    },
    {
      "name": "flattening_max_depth",
      "kind": "integer",
      "label": "Flattening Max Depth",
      "description": "The max depth to flatten schemas."
    },
    {
      "name": "is_sandbox",
      "kind": "boolean",
      "label": "Is Sandbox",
      "description": "DEPRECATED: Use domain. Is_sandbox-false = 'login', is_sandbox-True = 'test'"
    },
    {
      "name": "password",
      "kind": "string",
      "label": "Password",
      "description": "User/password username",
      "sensitive": true
    },
    {
      "name": "refresh_token",
      "kind": "string",
      "label": "Refresh Token",
      "description": "OAuth refresh_token",
      "sensitive": true
    },
    {
      "name": "security_token",
      "kind": "string",
      "label": "Security Token",
      "description": "User/password generated security token. Reset under your Account Settings",
      "sensitive": true
    },
    {
      "name": "stream_map_config",
      "kind": "object",
      "label": "Stream Map Config",
      "description": "User-defined config values to be used within map expressions."
    },
    {
      "name": "stream_maps",
      "kind": "object",
      "label": "Stream Maps",
      "description": "Config object for stream maps capability. For more information check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html)."
    },
    {
      "name": "username",
      "kind": "string",
      "label": "Username",
      "description": "User/password username"
    }
  ]
}
