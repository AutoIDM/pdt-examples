# Mails one digest of new Adobe, CISA, and Microsoft 365 status events.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "hourly"

config:
  # An item that changed longer ago than this is kept in the database but
  # never mailed. This also limits the first digest after you deploy.
  notify_lookback_days: 2

  # Adobe items to mail, by product name ("Photoshop") or cloud name
  # ("Creative Cloud"). The names are on https://status.adobe.com.
  # An empty list [] mails every Adobe product, about 25 items a day.
  adobe_products:
    - Creative Cloud
    - Document Cloud
    - Administrative Consoles
    - Adobe Account Management

# Env vars this app needs. `pdt validate` checks them against your .env,
# and `pdt deploy` uploads the ones that are set as cloud secrets.
# Adobe and CISA need nothing. Each optional block turns on one part.
env:
  required: []
  optional:
    # Mail. A JSON list of Apprise URIs. Without it the app only fills the database.
    - TARGET_APPRISE_URIS
    # Microsoft 365. An Entra app registration with ServiceHealth.Read.All
    # and ServiceMessage.Read.All (application) and admin consent.
    - PDT_AZURE_TENANT_ID
    - PDT_AZURE_CLIENT_ID
    - PDT_AZURE_CLIENT_SECRET
    - PDT_AZURE_PRIVATE_KEY_B64
    - PDT_AZURE_PRIVATE_KEY_PATH
    - PDT_AZURE_PRIVATE_KEY_PASSWORD
